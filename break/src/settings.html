<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 340px;
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    p.sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      display: block;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      color: #1a1a1a;
      appearance: none;
      cursor: pointer;
      outline: none;
      margin-bottom: 24px;
      transition: border-color 0.15s;
    }

    select:focus { border-color: #007aff; }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #0062cc; }

    #saved {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: #34c759;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>⏱ Reminder Settings</h2>
    <p class="sub">How often should the bird visit?</p>

    <label for="interval">Remind me every</label>
    <select id="interval">
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
      <option value="20">20 minutes</option>
      <option value="30" selected>30 minutes</option>
      <option value="45">45 minutes</option>
      <option value="60">1 hour</option>
      <option value="90">1.5 hours</option>
      <option value="120">2 hours</option>
    </select>

    <button id="save">Save & Restart Timer</button>
    <div id="saved">✓ Saved!</div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
