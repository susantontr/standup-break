<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #bird-container {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      /* start off-screen left */
      left: -320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: flyAcross 12s linear forwards;
    }

    @keyframes flyAcross {
      0%   { left: -320px; }
      100% { left: calc(100vw + 40px); }
    }

    #lottie-bird {
      width: 380px;
      height: 380px;
    }

    #banner {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      padding: 18px 48px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.28);
      text-align: center;
      white-space: nowrap;
    }

    #banner p {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
    }

    #banner span {
      font-size: 20px;
      font-weight: 400;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="bird-container">
    <div id="lottie-bird"></div>
    <div id="banner">
      <p>Time to stand up! 🌿</p>
      <span>Take a 2-minute break</span>
    </div>
  </div>

  <script src="../node_modules/lottie-web/build/player/lottie.min.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
